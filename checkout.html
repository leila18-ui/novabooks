<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — NovaBooks</title>
    <script src="panier.js" defer></script>
    <link rel="stylesheet" href="part/header.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

    <header class="partie1">
        <div class="brand">
            <h2><a href="index.html">NovaBooks</a></h2>
            <h5>Des histoires qui restent</h5>
        </div>

        <nav>
            <ul>
                <li><a href="about.html">À propos</a></li>
                <li><a href="products.html">Produits</a></li>
                <li class="panier">
                    <a href="cart.html">🛒<span id="icon-panier"></span></a>
                </li>
                <li><a href="checkout.html" class="active">Checkout</a></li>
            </ul>
        </nav>
    </header>

    <section class="form">
        <form id="checkout-form" action="traitement.php" method="post">

            <fieldset class="info">
                <legend>Informations personnelles</legend>

                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" placeholder="Entrez votre nom" required>

                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom" placeholder="Entrez votre prénom" required>

                <label for="tel">Téléphone</label>
                <input type="tel" id="tel" name="tel" placeholder="Entrez votre numéro" required>

                <label for="mail">Email</label>
                <input type="email" id="mail" name="mail" placeholder="Entrez votre email" required>
            </fieldset>

            <fieldset class="livraison">
                <legend>Adresse de livraison</legend>

                <label for="adresse">Adresse</label>
                <input type="text" id="adresse" name="adresse" placeholder="Entrez votre adresse" required>

                <label for="ville">Ville</label>
                <input type="text" id="ville" name="ville" placeholder="Entrez votre ville" required>
            </fieldset>

            <!-- UN SEUL BOUTON, en dehors des fieldsets -->
            <button type="submit" class="btn-valider">Valider la commande</button>

        </form>
    </section>









    <script>
(function() {
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));

    if (!currentUser) {
        localStorage.setItem('redirectAfterLogin', 'checkout.html');
        alert('⚠️ Connectez-vous pour accéder au checkout');
        window.location.href = 'contact.html';
    }
})();
</script>
</body>
</html>
